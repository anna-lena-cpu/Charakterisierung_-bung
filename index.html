<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8aa5ff;outline-offset:3px}.app{min-height:100vh;padding:26px clamp(16px,4vw,56px) 48px;max-width:1440px;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:50px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}.brand-mark{display:grid;place-items:center;width:42px;height:42px;background:var(--navy);border-radius:14px;color:white;font-size:22px}.top-note{font-size:13px;color:var(--muted);font-weight:650}.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(245px,.7fr);gap:28px;align-items:stretch;margin-bottom:34px}.hero-copy{padding:12px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 12px}.hero h1{font-size:clamp(36px,6vw,68px);line-height:1.02;letter-spacing:-.06em;margin:0;max-width:760px;color:var(--navy)}.hero h1 span{color:var(--blue)}.hero-copy>p:not(.eyebrow){font-size:17px;color:var(--muted);max-width:620px;margin:20px 0 0}.hero-art{position:relative;background:#dce6ff;border-radius:30px;min-height:205px;overflow:hidden;display:flex;align-items:flex-end;padding:25px 28px;color:var(--navy)}.hero-art:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#fff8;top:-66px;right:-25px}.hero-art:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:#aac0ff;top:39px;right:91px}.art-card{position:relative;z-index:1;background:#fff;border-radius:18px;padding:17px 20px;box-shadow:0 12px 30px #253b6830;transform:rotate(-3deg);max-width:240px}.art-card strong{display:block;font-size:17px}.art-card small{display:block;color:var(--muted);margin-top:4px}.art-spark{position:absolute;top:28px;left:35px;font-size:30px;z-index:1}.art-bubble{position:absolute;right:27px;bottom:25px;z-index:2;background:#f7c46e;border:4px solid #dce6ff;border-radius:15px;padding:8px 12px;font-weight:900;transform:rotate(7deg)}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:30px 0 16px}.section-head h2{margin:0;color:var(--navy);font-size:23px;letter-spacing:-.03em}.section-head p{margin:0;color:var(--muted);font-size:14px}.score-pill{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:750;color:var(--navy);white-space:nowrap}.score-dot{width:9px;height:9px;border-radius:50%;background:#efb65c}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.category-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:23px;box-shadow:0 7px 25px rgba(36,49,76,.035);display:flex;flex-direction:column;min-height:255px;position:relative;overflow:hidden}.card-top{display:flex;justify-content:space-between;align-items:flex-start}.category-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;font-size:23px}.icon-blue{background:#e8edff}.icon-mint{background:#e4f6ed}.icon-yellow{background:#fff1d8}.card-tag{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.category-card h3{font-size:23px;line-height:1.2;letter-spacing:-.035em;color:var(--navy);margin:17px 0 7px}.category-card p{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:320px}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}.question-count{font-size:12px;color:var(--muted);font-weight:700}.primary,.secondary,.ghost{border:0;border-radius:13px;padding:12px 17px;font-weight:800;transition:transform .15s,background .15s}.primary{background:var(--blue);color:white;box-shadow:0 6px 15px #4168d533}.primary:hover{background:#3157c2;transform:translateY(-1px)}.secondary{background:var(--blue-pale);color:var(--blue)}.secondary:hover{background:#e2e9ff}.ghost{background:transparent;color:var(--muted);padding:10px 12px}.ghost:hover{background:#f0f1f5;color:var(--ink)}button:disabled{cursor:not-allowed;opacity:.56;transform:none!important;box-shadow:none}.locked-card{background:linear-gradient(145deg,#fff,#f9f9fb)}.lock-banner{display:flex;align-items:center;gap:8px;color:#8c5b19;background:#fff5df;border-radius:11px;padding:8px 11px;font-size:12px;font-weight:750;margin:0 0 12px}.lock-banner[hidden]{display:none}.footer-note{font-size:12px;color:#8992a1;margin:22px 2px 0}

.game{max-width:890px;margin:0 auto}.game-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:-18px 0 23px}.back-btn{border:0;background:none;color:var(--muted);font-weight:750;padding:9px 0}.back-btn:hover{color:var(--navy)}.game-meta{display:flex;gap:10px;align-items:center}.meta-chip{padding:9px 13px;border:1px solid var(--line);background:white;border-radius:999px;font-size:12px;font-weight:800;color:var(--navy)}.progress-wrap{margin-bottom:19px}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:750;margin-bottom:8px}.progress-track{height:8px;border-radius:99px;background:#e5e7ed;overflow:hidden}.progress-fill{height:100%;width:10%;background:linear-gradient(90deg,#4168d5,#7695ff);border-radius:99px;transition:width .3s}.question-card{background:white;border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,42px);box-shadow:var(--shadow)}.question-type{color:var(--blue);text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:900;margin:0 0 13px}.question-card h2{font-size:clamp(23px,4vw,32px);line-height:1.25;letter-spacing:-.04em;color:var(--navy);margin:0 0 11px}.question-context{font-size:15px;color:var(--muted);margin:0 0 22px}.passage{padding:16px 18px;background:#f5f7fb;border-radius:15px;border-left:4px solid #bac8f5;color:#34415b;margin:17px 0 20px;font-family:Georgia,serif;font-size:16px}.choices{display:grid;gap:10px;margin-top:22px}.choice{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:14px 16px;border:1.5px solid var(--line);background:white;border-radius:15px;color:var(--ink);font-weight:600;transition:.15s}.choice:hover{border-color:#aab9ee;background:#fafbff}.choice.selected{border-color:var(--blue);background:var(--blue-pale)}.choice.correct{border-color:#76c8a6;background:#effaf5}.choice.wrong{border-color:#e8aaa3;background:#fff5f3}.choice-indicator{flex:none;width:22px;height:22px;border:1.5px solid #b8bfcc;border-radius:50%;display:grid;place-items:center;font-size:12px;margin-top:1px;color:white}.multi .choice-indicator{border-radius:6px}.choice.selected .choice-indicator{background:var(--blue);border-color:var(--blue)}.choice.correct .choice-indicator{background:var(--green);border-color:var(--green)}.choice.wrong .choice-indicator{background:var(--red);border-color:var(--red)}.text-answer{display:block;width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;margin-top:20px;color:var(--ink);background:#fff}.text-answer::placeholder{color:#9aa2b0}.order-note{font-size:13px;color:var(--muted);margin-top:15px}.word-bank{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0}.word-chip{border:1px solid #dfe3ed;background:#f7f8fb;border-radius:11px;padding:9px 12px;color:#34415b;font-weight:700}.word-chip:hover{border-color:var(--blue);color:var(--blue)}.word-chip.used{opacity:.38;cursor:not-allowed}.answer-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:53px;padding:10px;border:1.5px dashed #cbd1dd;border-radius:13px;background:#fafbfc}.answer-line .word-chip{background:var(--blue-pale);border-color:#cad5ff;color:#3556b5}.answer-line .placeholder{color:#9ba4b3;font-size:13px;padding:5px}.question-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}.hint-btn{border:0;background:none;color:#876015;font-weight:800;padding:11px 4px}.hint-btn:hover{text-decoration:underline}.hint-box{background:#fff7e7;border:1px solid #f3dfb9;border-radius:13px;color:#715321;padding:13px 15px;font-size:14px;margin-top:14px}.hint-box[hidden]{display:none}.feedback{margin-top:20px;padding:15px 17px;border-radius:15px;font-size:14px;font-weight:650}.feedback.good{background:#e9f7f0;color:#146646}.feedback.bad{background:#fff0ed;color:#963b34}.feedback strong{display:block;font-size:16px;margin-bottom:3px}.feedback[hidden]{display:none}.result-card{text-align:center;padding:clamp(28px,6vw,54px)}.result-badge{width:76px;height:76px;border-radius:24px;background:#fff1d8;margin:0 auto 18px;display:grid;place-items:center;font-size:36px}.result-card h2{margin:0 0 8px}.result-score{font-size:56px;font-weight:900;letter-spacing:-.07em;color:var(--blue);line-height:1.1;margin:18px 0 5px}.result-copy{color:var(--muted);max-width:540px;margin:0 auto 23px}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.mini-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 24px}.mini-stats span{border:1px solid var(--line);border-radius:12px;padding:9px 13px;color:#586579;font-size:12px;font-weight:750}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#26395b;color:white;padding:12px 17px;border-radius:13px;box-shadow:var(--shadow);font-weight:700;font-size:13px;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}

<script>
const categories = {
  bas: {title:"Basissatz", subtitle:"Texte knapp und treffend vorstellen", icon:"✍️", color:"blue", tasks:[
    {type:"mc",label:"Multiple Choice",q:"Welcher Satz eignet sich am besten als Basissatz für eine Inhaltsangabe?",ctx:"Gesucht sind Textsorte, Titel, Autor, Erscheinungsjahr und Thema.",choices:["Franz Kafka schrieb eine spannende Geschichte über Gregor.","In der Erzählung „Die Verwandlung“ von Franz Kafka aus dem Jahr 1915 wird die Verwandlung Gregor Samsas und ihre Auswirkung auf seine Familie dargestellt.","Gregor wacht eines Morgens auf und ist ein Käfer. Danach wird er von seiner Familie schlecht behandelt."],answer:1,hint:"Ein Basissatz nennt die wichtigsten Angaben zum Text und fasst sein Thema in einem Satz zusammen."},
    {type:"text",label:"Lückentext",q:"Ergänze die passende Textsorte.",ctx:"„Die Verwandlung“ von Franz Kafka aus dem Jahr 1915 ist eine …, in der Gregor Samsas Verwandlung und ihre Folgen für seine Familie dargestellt werden.",answers:["erzählung","kurzerzählung"],placeholder:"Textsortenbezeichnung …",hint:"Der Text ist länger als eine typische Kurzgeschichte und wird meist als Erzählung bezeichnet."},
    {type:"mc",label:"Stil erkennen",q:"Was gehört normalerweise nicht in einen Basissatz?",choices:["Titel und Autor oder Autorin", "Eine persönliche Bewertung wie „Die Geschichte ist toll“", "Textsorte und zentrales Thema"],answer:1,hint:"Der Basissatz informiert sachlich. Die eigene Meinung gehört nicht hinein."},
    {type:"order",label:"Satzpuzzle",q:"Bringe die Satzteile in eine sinnvolle Reihenfolge.",ctx:"Beginne mit der Textsorte und nenne dann die Angaben zum Text.",items:["In der Kurzgeschichte", "„Das Brot“", "von Wolfgang Borchert", "aus dem Jahr 1946", "wird ein Ehepaar gezeigt, das nach dem Krieg mit Hunger und Scham umgehen muss."],answer:[0,1,2,3,4],hint:"Ein klarer Aufbau ist: Textsorte – Titel – Autor – Jahr – Thema."},
    {type:"mc",label:"Wissen anwenden",q:"Wozu dient der Basissatz am Anfang einer Inhaltsangabe?",choices:["Er stellt den Text kurz vor und nennt sein Thema.","Er erzählt bereits alle Einzelheiten der Handlung nach.","Er bewertet, ob die Hauptfigur sympathisch ist."],answer:0,hint:"Der Basissatz ist die knappe Orientierung für die Leserin oder den Leser."},
    {type:"text",label:"Lückentext",q:"Welche Angabe fehlt?",ctx:"„In dem Jugendroman „Tschick“ von Wolfgang Herrndorf aus dem Jahr 2010 …“",answers:["jugendroman","roman"],placeholder:"Textsorte …",hint:"Die gesuchte Angabe benennt die Art des Textes."},
    {type:"multi",label:"Mehrfachauswahl",q:"Welche Angaben passen in einen vollständigen Basissatz?",ctx:"Wähle alle passenden Bestandteile aus.",choices:["Textsorte", "Titel", "Autor oder Autorin", "Erscheinungsjahr (wenn bekannt)", "Zentrales Thema", "Eigene Meinung zum Text", "Ausführliche Nacherzählung des Schlusses"],answer:[0,1,2,3,4],hint:"Der Basissatz stellt den Text sachlich vor. Meinungen und Einzelheiten der Handlung kommen später oder gar nicht hinein."},
    {type:"mc",label:"Fehler finden",q:"Was ist an diesem Basissatz problematisch?",ctx:"„In der Kurzgeschichte „Das Brot“ von Wolfgang Borchert ist die Frau ziemlich gemein und die Geschichte ist sehr traurig.“",choices:["Er enthält wertende Meinungen statt einer sachlichen Themenangabe.","Er nennt zu viele Angaben zum Text.","Ein Basissatz darf keine Autorennamen enthalten."],answer:0,hint:"Achte auf Wörter wie „gemein“ und „sehr traurig“: Das sind Bewertungen."},
    {type:"text",label:"Lückentext",q:"Setze das passende Wort ein.",ctx:"Ein guter Basissatz formuliert das Thema des Textes kurz und …",answers:["sachlich","neutral"],placeholder:"Adjektiv …",hint:"Gesucht ist ein Wort für eine Formulierung ohne persönliche Wertung."},
    {type:"mc",label:"Kurz prüfen",q:"Welche Aussage über den Basissatz stimmt?",choices:["Er steht meist am Anfang der Inhaltsangabe und umfasst in der Regel einen Satz.","Er ersetzt die ganze Inhaltsangabe.","Er muss immer ein wörtliches Zitat enthalten."],answer:0,hint:"Der Basissatz eröffnet die Inhaltsangabe; danach folgt die knappe Wiedergabe der Handlung."}
  ]},
  inh: {title:"Inhaltsangabe", subtitle:"Handlungen knapp und durchgehend im Präsens zusammenfassen", icon:"📖", color:"mint", tasks:[
    {type:"mc",label:"Multiple Choice",q:"In welcher Zeitform schreibst du eine Inhaltsangabe durchgehend?",choices:["Präsens", "Präteritum", "Futur I"],answer:0,hint:"Alle Handlungsschritte werden im Präsens wiedergegeben."},
    {type:"text",label:"Lückentext",q:"Ergänze die passende Zeitform.",ctx:"Mia öffnet den Brief und … (lesen) die Nachricht sofort.",answers:["liest"],placeholder:"Verbform im Präsens …",hint:"Das Verb steht im Präsens: „sie liest“."},
    {type:"order",label:"Schritte ordnen",q:"Ordne die Teile einer Inhaltsangabe in eine sinnvolle Reihenfolge.",items:["Einleitung mit Basissatz", "Wichtigste Handlungsschritte in sinnvoller Reihenfolge", "Schluss: Ergebnis oder Ausgang des zentralen Konflikts"],answer:[0,1,2],hint:"Orientiere dich vom Überblick über den Hauptteil bis zum Ende der Handlung."},
    {type:"mc",label:"Stil erkennen",q:"Welche Formulierung passt am besten zu einer sachlichen Inhaltsangabe?",choices:["Zum Glück erkennt Mia endlich, wie dumm ihr Plan war!", "Mia bemerkt, dass ihr Plan nicht funktioniert, und sucht nach einer anderen Lösung.", "„Das war die schlechteste Idee aller Zeiten!“, ruft Mia."],answer:1,hint:"Eine Inhaltsangabe bleibt sachlich und gibt direkte Rede normalerweise nicht wörtlich wieder."},
    {type:"multi",label:"Mehrfachauswahl",q:"Welche Merkmale passen zu einer guten Inhaltsangabe?",choices:["Sie ist knapp und sachlich.","Sie steht durchgehend im Präsens.","Sie enthält alle Nebensächlichkeiten.","Sie gibt die Handlung in sinnvoller Reihenfolge wieder.","Sie enthält persönliche Urteile."],answer:[0,1,3],hint:"Wichtige Handlungsschritte auswählen, ordnen und neutral formulieren. Auch der Schluss steht im Präsens."},
    {type:"text",label:"Lückentext",q:"Ergänze das fehlende Verb.",ctx:"Eine Inhaltsangabe … die wichtigsten Ereignisse eines Textes knapp …",answers:["fasst zusammen","fasst die wichtigsten ereignisse zusammen"],placeholder:"zwei Wörter …",hint:"Das Verb bedeutet: etwas kurz wiedergeben."},
    {type:"mc",label:"Wichtiges auswählen",q:"Ein Text handelt von Leon, der sein verlorenes Heft sucht, Freundinnen um Hilfe bittet und es schließlich im Bus findet. Was ist für die Inhaltsangabe am wichtigsten?",choices:["Leon sucht sein Heft, bittet um Hilfe und findet es im Bus.","Leon trägt eine blaue Jacke und hat einen grünen Rucksack.","Die Bushaltestelle liegt an einer großen Straße."],answer:0,hint:"Nimm die Ereignisse auf, die den Verlauf der Handlung ausmachen."},
    {type:"order",label:"Handlung ordnen",q:"Ordne die Ereignisse einer kurzen Geschichte.",ctx:"Nora findet einen verletzten Vogel, versorgt ihn und lässt ihn wieder frei.",items:["Nora entdeckt den Vogel im Garten.","Sie bringt ihn vorsichtig in eine Schachtel und gibt ihm Wasser.","Als er sich erholt hat, öffnet sie die Schachtel im Park.","Der Vogel fliegt davon."],answer:[0,1,2,3],hint:"Ordne danach, was zuerst, danach und zuletzt passiert."},
    {type:"mc",label:"Wörtliche Rede",q:"Wie gibst du direkte Rede in einer Inhaltsangabe am besten wieder?",choices:["Du schreibst den ganzen Dialog mit Anführungszeichen ab.","Du fasst den Inhalt der Äußerung in eigenen Worten zusammen.","Du lässt jede wichtige Äußerung weg."],answer:1,hint:"Nur wenn ein Zitat besonders wichtig ist, kann ein sehr kurzes Zitat sinnvoll sein. Meist reichen eigene Worte."},
    {type:"multi",label:"Abschluss-Check",q:"Was solltest du vor dem Abgeben deiner Inhaltsangabe prüfen?",choices:["Sind die wichtigsten Ereignisse enthalten?", "Steht die gesamte Inhaltsangabe im Präsens?", "Habe ich sachlich und in eigenen Worten geschrieben?", "Habe ich möglichst viele Details ergänzt?"],answer:[0,1,2],hint:"Eine gute Inhaltsangabe ist knapp, sachlich, in eigenen Worten und vollständig im Präsens verfasst."}
  ]},
  cha: {title:"Charakterisierung", subtitle:"Eigenschaften belegen und im Präsens beschreiben", icon:"🔎", color:"yellow", tasks:[
    {type:"mc",label:"Multiple Choice",q:"Was bedeutet eine direkte Charakterisierung?",choices:["Der Erzähler oder eine Figur nennt eine Eigenschaft ausdrücklich.","Lesende schließen aus dem Verhalten auf eine Eigenschaft.","Die Figur wird nur durch ihr Aussehen beschrieben."],answer:0,hint:"Bei der direkten Charakterisierung wird eine Eigenschaft direkt benannt."},
    {type:"mc",label:"Aus Verhalten schließen",q:"Welche Eigenschaft passt am ehesten zu Sam?",ctx:"Sam bemerkt, dass ein neues Kind allein sitzt. Er geht hin, stellt sich vor und lädt es zum Mitspielen ein.",choices:["hilfsbereit und offen", "angeberisch", "gleichgültig"],answer:0,hint:"Achte darauf, was Sam tut und wie sein Verhalten auf andere wirkt."},
    {type:"text",label:"Eigenschaft finden",q:"Wie nennt man eine Person, die ihr Ziel trotz Schwierigkeiten weiterverfolgt?",answers:["ausdauernd","hartnäckig","beharrlich","zielstrebig"],placeholder:"Passendes Eigenschaftswort …",hint:"Gesucht ist ein positives Wort für jemanden, der nicht schnell aufgibt."},
    {type:"multi",label:"Mehrfachauswahl",q:"Welche Aussagen sind passende, begründete Charakterisierungen?",choices:["Lina ist verantwortungsbewusst, denn sie übernimmt freiwillig die Betreuung ihres kleinen Bruders.","Lina ist die Beste und alle anderen sind langweilig.","Lina wirkt vorsichtig, weil sie vor der Entscheidung erst Informationen sammelt.","Lina ist doof."],answer:[0,2],hint:"Verknüpfe eine Eigenschaft mit einer konkreten Beobachtung aus dem Text."},
    {type:"order",label:"Begründung aufbauen",q:"Bringe die Schritte einer begründeten Charakterisierung in die passende Reihenfolge.",items:["Beobachtung oder Textbeleg nennen", "Verhalten deuten", "Passende Eigenschaft formulieren"],answer:[0,1,2],hint:"Erst zeigst du, was im Text passiert. Dann erklärst du, was das über die Figur aussagt."},
    {type:"mc",label:"Indirekt oder direkt?",q:"„Paul ist ein sehr geduldiger Junge“, heißt es im Erzählertext. Welche Form ist das?",choices:["Direkte Charakterisierung", "Indirekte Charakterisierung", "Äußere Beschreibung"],answer:0,hint:"Die Eigenschaft „geduldig“ wird ausdrücklich genannt."},
    {type:"text",label:"Fachbegriff",q:"Wie heißt es, wenn Lesende eine Eigenschaft aus Taten oder Äußerungen erschließen?",answers:["indirekte charakterisierung","indirekt"],placeholder:"Fachbegriff …",hint:"Bei dieser Form wird die Eigenschaft nicht direkt ausgesprochen."},
    {type:"mc",label:"Textbeleg wählen",q:"Welche Aussage ist am besten belegt?",ctx:"Im Text leiht Amir seiner Mitschülerin sein einziges Lineal, obwohl er es selbst noch braucht.",choices:["Amir ist hilfsbereit, weil er sein Lineal mit ihr teilt.","Amir ist reich, weil er ein Lineal besitzt.","Amir ist unordentlich, weil er etwas verleiht."],answer:0,hint:"Der Beleg sollte die genannte Eigenschaft tatsächlich stützen."},
    {type:"multi",label:"Eigenschaften erkennen",q:"Welche Eigenschaften lassen sich durch die jeweilige Handlung plausibel vermuten?",ctx:"Wähle die Eigenschaften, die zu dieser Handlung passen: Jo entdeckt beim Aufräumen einen Fehler in der Gruppenarbeit und weist die anderen freundlich darauf hin.",choices:["aufmerksam", "rücksichtsvoll", "unzuverlässig", "gleichgültig"],answer:[0,1],hint:"Die Person bemerkt den Fehler und spricht die Gruppe freundlich darauf an."},
    {type:"mc",label:"Abschluss-Check",q:"Was sollte eine Charakterisierung vermeiden?",choices:["Eigenschaften mit passenden Textstellen zu begründen.","Eine Figur vorschnell zu beurteilen, ohne Belege zu nennen.","Verhalten und Äußerungen der Figur auszuwerten."],answer:1,hint:"Eine Charakterisierung ist keine bloße Meinung. Belege aus dem Text machen deine Deutung nachvollziehbar."},
    {type:"mc",label:"Eigenschaft aus dem Text",q:"Welche Eigenschaft zeigt Nika am ehesten?",ctx:"Im vollen Bus macht Nika Platz für eine ältere Person und achtet darauf, dass niemand an der Tür eingeklemmt wird.",choices:["rücksichtsvoll", "ungeduldig", "eitel"],answer:0,hint:"Nika achtet auf die Bedürfnisse und Sicherheit anderer."},
    {type:"text",label:"Eigenschaft aus dem Text",q:"Welche Eigenschaft passt zu Miro?",ctx:"Miro übt eine schwierige Szene immer wieder. Er nimmt Hinweise der Regisseurin an und probiert es erneut, bis es klappt.",answers:["ausdauernd","hartnäckig","fleißig","zielstrebig"],placeholder:"Passendes Eigenschaftswort …",hint:"Miro gibt trotz Schwierigkeiten nicht auf und übt weiter."},
    {type:"mc",label:"Eigenschaft aus dem Text",q:"Wie lässt sich Ayla am besten charakterisieren?",ctx:"Ayla findet auf dem Schulhof ein Portemonnaie. Sie bringt es ins Sekretariat, ohne etwas daraus zu nehmen.",choices:["ehrlich und verantwortungsbewusst", "neidisch", "vergesslich"],answer:0,hint:"Ayla gibt den Fund ab und geht sorgfältig damit um."},
    {type:"text",label:"Eigenschaft aus dem Text",q:"Welche Eigenschaft zeigt Ben?",ctx:"Ben merkt, dass sein Freund still ist. Er setzt sich zu ihm und fragt vorsichtig, ob er erzählen möchte, was los ist.",answers:["einfühlsam","mitfühlend","empathisch","verständnisvoll"],placeholder:"Passendes Eigenschaftswort …",hint:"Ben nimmt die Gefühle seines Freundes wahr und geht behutsam darauf ein."},
    {type:"mc",label:"Eigenschaft aus dem Text",q:"Welche Eigenschaft passt am besten zu Tim?",ctx:"Tim prüft am Vorabend den Fahrplan, packt seine Sachen und kommt am nächsten Morgen rechtzeitig zum Treffpunkt.",choices:["zuverlässig und organisiert", "leichtsinnig", "streitsüchtig"],answer:0,hint:"Tim plant voraus und hält die Abmachung ein."},
    {type:"mc",label:"Präsens in der Charakterisierung",q:"Welche Formulierung steht vollständig im Präsens?",choices:["Mara ist zunächst zurückhaltend, beobachtet die Gruppe und beteiligt sich später am Gespräch.","Mara war zunächst zurückhaltend und beobachtet die Gruppe.","Mara ist zunächst zurückhaltend und beteiligte sich später am Gespräch."],answer:0,hint:"In einer Charakterisierung schreibst du durchgehend im Präsens: Auch Verhalten und Entwicklung formulierst du in dieser Zeitform."}
  ]},
  gra: {title:"Grammatik", subtitle:"Indirekte Rede, Nominalisierung und Satzbau", icon:"🧩", color:"blue", tasks:[
    {type:"mc",label:"Indirekte Rede",q:"Welche Form gibt die Aussage korrekt in indirekter Rede wieder?",ctx:"Lena sagt: „Ich bin erkältet.“",choices:["Lena sagt, sie sei erkältet.","Lena sagt, ich bin erkältet.","Lena sagt, sie war erkältet."],answer:0,hint:"In der indirekten Rede steht oft der Konjunktiv I. Passe außerdem das Pronomen an."},
    {type:"text",label:"Konjunktiv I",q:"Setze das Verb in den Konjunktiv I.",ctx:"Mira erklärt, sie ___ morgen später. (kommen)",answers:["komme"],placeholder:"Verbform …",hint:"Bei „sie“ lautet der Konjunktiv I von „kommen“: komme."},
    {type:"mc",label:"Indirekte Rede",q:"Welche Form ist passend, wenn Konjunktiv I und Indikativ gleich klingen?",ctx:"Die Spieler sagen: „Wir haben keine Zeit.“",choices:["Die Spieler sagen, sie hätten keine Zeit.","Die Spieler sagen, sie haben keine Zeit.","Die Spieler sagen, sie hatten keine Zeit."],answer:0,hint:"Wenn der Konjunktiv I nicht erkennbar ist, kann der Konjunktiv II als Ersatzform verwendet werden."},
    {type:"multi",label:"Nominalisierte Adjektive",q:"In welchen Sätzen ist das Adjektiv als Nomen gebraucht und deshalb großgeschrieben?",choices:["Das Beste kommt zum Schluss.","Sie entdeckt etwas Interessantes.","Wir lesen ein spannendes Buch.","Er trägt eine warme Jacke."],answer:[0,1],hint:"Nominalisierte Adjektive stehen oft nach Wörtern wie „das“, „etwas“ oder „alles“ und werden großgeschrieben."},
    {type:"text",label:"Adjektiv nominalisieren",q:"Bilde aus dem Adjektiv eine passende Nominalisierung.",ctx:"„Ich wünsche dir alles ___ zum Geburtstag.“ (gut)",answers:["gute"],placeholder:"Nominalisiertes Adjektiv …",hint:"Nach „alles“ wird „gut“ als Nomen gebraucht: „alles Gute“."},
    {type:"text",label:"Nominalisierung umformen",q:"Formuliere das nominalisierte Adjektiv als Adjektiv um. Ergänze das letzte Wort.",ctx:"„Das Ungewöhnliche an dem Plan gefällt mir.“ → „Der Plan ist ___.“",answers:["ungewöhnlich"],placeholder:"Adjektiv …",hint:"Das nominalisierte Adjektiv „das Ungewöhnliche“ beschreibt den Plan."},
    {type:"mc",label:"Haupt- und Nebensatz",q:"Welche Verbindung mit „weil“ ist richtig?",ctx:"Mila bleibt zu Hause. Sie ist krank.",choices:["Mila bleibt zu Hause, weil sie krank ist.","Mila bleibt zu Hause, weil ist sie krank.","Mila bleibt, weil zu Hause sie krank ist."],answer:0,hint:"Nach „weil“ steht das finite Verb im Nebensatz am Ende. Zwischen Haupt- und Nebensatz steht ein Komma."},
    {type:"order",label:"Satzteile verbinden",q:"Ordne die Satzteile zu einem richtigen Satz mit „obwohl“.",items:["Obwohl", "der Bus verspätet ist,", "erreicht Lea", "den Unterricht rechtzeitig."],answer:[0,1,2,3],hint:"Der Nebensatz mit „obwohl“ steht hier zuerst. Nach dem Komma folgt der Hauptsatz."},
    {type:"mc",label:"Satzverbindung prüfen",q:"Welcher Satz verbindet Haupt- und Nebensatz richtig?",ctx:"Ben freut sich. Seine Mannschaft gewinnt das Spiel.",choices:["Ben freut sich, weil seine Mannschaft das Spiel gewinnt.","Ben freut sich weil, seine Mannschaft gewinnt das Spiel.","Ben freut sich, weil gewinnt seine Mannschaft das Spiel."],answer:0,hint:"Der Nebensatz beginnt mit „weil“, das Komma trennt die Sätze und „gewinnt“ steht am Ende."},
    {type:"multi",label:"Satzverbindungen",q:"Welche Sätze sind richtig verbunden und geschrieben?",choices:["Ich nehme einen Schirm mit, weil es regnet.","Obwohl der Weg weit ist, gehen wir zu Fuß.","Sie hofft dass, der Zug pünktlich kommt.","Wir warten, wenn der Unterricht gleich beginnt."],answer:[0,1,3],hint:"Nebensätze werden mit Komma abgetrennt. Das finite Verb steht im Nebensatz am Ende."}
  ]}
};
const LABELS={mc:"Wähle eine Antwort",multi:"Wähle alle passenden Antworten",text:"Schreibe deine Antwort",order:"Tippe die Satzteile in der richtigen Reihenfolge an"};
let state={screen:"home",category:null,index:0,score:0,answered:false,selected:[],order:[],total:0,completed:0};
const main=document.getElementById("main");
function getLocks(){try{return JSON.parse(localStorage.getItem("deutschCheckLocks")||"{}")}catch{return {}}}
function setLock(id,time){const x=getLocks();x[id]=time;localStorage.setItem("deutschCheckLocks",JSON.stringify(x))}
function fmtTime(ms){let sec=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function home(){state.screen="home";state.category=null;renderHome()}
function renderHome(){
 const locks=getLocks();let cards="";
 Object.entries(categories).forEach(([id,c])=>{const left=(locks[id]||0)-Date.now();const locked=left>0;cards+=`<article class="category-card ${locked?"locked-card":""}"><div class="card-top"><div class="category-icon icon-${c.color}">${c.icon}</div><span class="card-tag">Gemischter Schwierigkeitsgrad</span></div><h3>${c.title}</h3><p>${c.subtitle}</p><div class="lock-banner" id="lock-${id}" ${locked?"":"hidden"}>🔒 Erneut spielbar in <span class="countdown" data-id="${id}">${fmtTime(left)}</span></div><div class="card-bottom"><span class="question-count">${c.tasks.length} Aufgaben · bis zu ${c.tasks.length} Punkte</span><button class="primary start-category" data-id="${id}" ${locked?"disabled":""}>${locked?"Gesperrt":"Los geht’s"}</button></div></article>`});
 main.innerHTML=`<section class="hero"><div class="hero-copy"><p class="eyebrow">Üben · Wiederholen · Sicherer werden</p><h1>Mach dich fit<br>in <span>Deutsch.</span></h1><p>Trainiere wichtige Themen für die 8. Klasse – in kurzen Runden, mit direkten Rückmeldungen und Tipps, wenn du sie brauchst.</p></div><div class="hero-art" aria-hidden="true"><div class="art-spark">✦</div><div class="art-card"><strong>Eine Aufgabe nach der anderen.</strong><small>Du schaffst das Schritt für Schritt.</small></div><div class="art-bubble">+1 Punkt</div></div></section><div class="section-head"><div><h2>Womit möchtest du starten?</h2><p>Wähle eine Kategorie aus und leg los.</p></div><div class="score-pill"><span class="score-dot"></span> Punkte insgesamt: <strong id="total-score">${state.total}</strong></div></div><section class="cards" aria-label="Lernkategorien">${cards}</section><p class="footer-note">Nach einer abgeschlossenen Runde pausiert diese Kategorie 10 Minuten. Währenddessen kannst du die anderen Themen spielen.</p>`;
 document.querySelectorAll(".start-category").forEach(b=>b.addEventListener("click",()=>start(b.dataset.id)));
 updateCountdowns();
}
let countdownTimer;
function updateCountdowns(){clearInterval(countdownTimer); countdownTimer=setInterval(()=>{document.querySelectorAll(".countdown").forEach(el=>{const remain=(getLocks()[el.dataset.id]||0)-Date.now();if(remain<=0){renderHome()}else el.textContent=fmtTime(remain)})},1000)}
function start(id){const remaining=(getLocks()[id]||0)-Date.now();if(remaining>0){toast("Diese Kategorie ist noch kurz gesperrt.");renderHome();return}state.screen="game";state.category=id;state.index=0;state.score=0;state.answered=false;state.selected=[];state.order=[];renderQuestion()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderQuestion(){
 const c=categories[state.category],t=c.tasks[state.index],num=state.index+1;
 state.answered=false;state.selected=[];state.order=[];
 let control="";
 if(t.type==="mc"||t.type==="multi") control=`<div class="choices ${t.type=== "multi"?"multi":""}" role="group" aria-label="${LABELS[t.type]}">${t.choices.map((x,i)=>`<button class="choice" type="button" data-choice="${i}" aria-pressed="false"><span class="choice-indicator" aria-hidden="true"></span><span>${esc(x)}</span></button>`).join("")}</div>`;
 if(t.type==="text") control=`<input class="text-answer" id="answer-input" type="text" autocomplete="off" placeholder="${esc(t.placeholder||"Deine Antwort …")}" aria-label="Deine Antwort">`;
 if(t.type==="order")control=`<div class="order-note">Tippe die Teile unten nacheinander an:</div><div class="word-bank">${t.items.map((x,i)=>`<button class="word-chip" type="button" data-item="${i}">${esc(x)}</button>`).join("")}</div><div class="answer-line" id="answer-line"><span class="placeholder">Deine Reihenfolge erscheint hier …</span></div>`;
 main.innerHTML=`<section class="game"><div class="game-head"><button class="back-btn" id="back-home">← Zur Übersicht</button><div class="game-meta"><span class="meta-chip">${c.icon} ${c.title}</span><span class="meta-chip">⭐ ${state.score} Punkte</span></div></div><div class="progress-wrap"><div class="progress-label"><span>Aufgabe ${num} von ${c.tasks.length}</span><span>${Math.round(num/c.tasks.length*100)}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${num/c.tasks.length*100}%"></div></div></div><article class="question-card"><p class="question-type">${t.label} · ${LABELS[t.type]}</p><h2>${esc(t.q)}</h2>${t.ctx?`<p class="question-context">${esc(t.ctx)}</p>`:""}${control}<div class="hint-box" id="hint-box" hidden>💡 ${esc(t.hint)}</div><div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div><div class="question-actions"><button class="hint-btn" id="hint-button" type="button">💡 Tipp anzeigen</button><button class="primary" id="submit-answer" type="button">Antwort prüfen</button></div></article></section>`;
 document.getElementById("back-home").addEventListener("click",home);document.getElementById("hint-button").addEventListener("click",toggleHint);document.getElementById("submit-answer").addEventListener("click",submitAnswer);
 if(t.type==="mc"||t.type==="multi")document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>selectChoice(b)));
 if(t.type==="order")document.querySelectorAll("[data-item]").forEach(b=>b.addEventListener("click",()=>toggleOrder(b)));
 if(t.type==="text"){const input=document.getElementById("answer-input");input.addEventListener("keydown",e=>{if(e.key==="Enter")submitAnswer()});input.focus()}
}
function toggleHint(){const box=document.getElementById("hint-box"),btn=document.getElementById("hint-button");box.hidden=!box.hidden;btn.textContent=box.hidden?"💡 Tipp anzeigen":"Tipp ausblenden"}
function selectChoice(b){if(state.answered)return;const t=categories[state.category].tasks[state.index],i=Number(b.dataset.choice);if(t.type==="mc"){state.selected=[i]}else{state.selected=state.selected.includes(i)?state.selected.filter(x=>x!==i):[...state.selected,i]}document.querySelectorAll(".choice").forEach(x=>{const on=state.selected.includes(Number(x.dataset.choice));x.classList.toggle("selected",on);x.setAttribute("aria-pressed",String(on))})}
function toggleOrder(b){if(state.answered||b.classList.contains("used"))return;state.order.push(Number(b.dataset.item));b.classList.add("used");b.disabled=true;drawOrder()}
function drawOrder(){const line=document.getElementById("answer-line"),t=categories[state.category].tasks[state.index];line.innerHTML=state.order.length?state.order.map(i=>`<button class="word-chip" type="button" data-remove="${i}" title="Entfernen">${esc(t.items[i])} ×</button>`).join(""):`<span class="placeholder">Deine Reihenfolge erscheint hier …</span>`;line.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",()=>{if(state.answered)return;const i=Number(b.dataset.remove);state.order=state.order.filter(x=>x!==i);const chip=document.querySelector(`[data-item="${i}"]`);chip.disabled=false;chip.classList.remove("used");drawOrder()}))}
function normalize(s){return String(s).toLocaleLowerCase("de-DE").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[„“”"'.,!?;:()]/g," ").replace(/\s+/g," ").trim()}
function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function submitAnswer(){if(state.answered)return;const t=categories[state.category].tasks[state.index];let correct=false,hasAnswer=true;
 if(t.type==="mc"){hasAnswer=state.selected.length>0;correct=state.selected[0]===t.answer}
 else if(t.type==="multi"){hasAnswer=state.selected.length>0;correct=sameSet(state.selected,t.answer)}
 else if(t.type==="text"){const val=normalize(document.getElementById("answer-input").value);hasAnswer=!!val;correct=t.answers.map(normalize).includes(val)}
 else {hasAnswer=state.order.length===t.items.length;correct=hasAnswer&&state.order.every((x,i)=>x===t.answer[i])}
 if(!hasAnswer){toast(t.type==="order"?"Ordne bitte alle Teile an.":"Wähle oder schreibe zuerst eine Antwort.");return}
 state.answered=true;if(correct)state.score++;
 const fb=document.getElementById("feedback");fb.hidden=false;fb.className=`feedback ${correct?"good":"bad"}`;fb.innerHTML=correct?`<strong>Richtig! +1 Punkt 🎉</strong>Gut gemacht – du hast die Aufgabe sicher gelöst.`:`<strong>Noch nicht ganz.</strong>${explanation(t)}`;
 if(t.type==="mc"||t.type==="multi"){document.querySelectorAll(".choice").forEach(b=>{const i=Number(b.dataset.choice);b.disabled=true;const expected=t.type==="mc"?i===t.answer:t.answer.includes(i);if(expected)b.classList.add("correct");else if(state.selected.includes(i))b.classList.add("wrong")})}
 if(t.type==="text")document.getElementById("answer-input").disabled=true;
 if(t.type==="order")document.querySelectorAll("[data-remove]").forEach(b=>b.disabled=true);
 const submit=document.getElementById("submit-answer");submit.textContent=state.index===categories[state.category].tasks.length-1?"Auswertung ansehen":"Weiter";submit.className="primary";submit.addEventListener("click",advance,{once:true});document.getElementById("hint-button").disabled=true;
 document.querySelectorAll(".meta-chip")[1].textContent=`⭐ ${state.score} Punkte`;
}
function explanation(t){if(t.type==="mc")return `Richtige Antwort: ${esc(t.choices[t.answer])}`;if(t.type==="multi")return `Passend sind: ${t.answer.map(i=>esc(t.choices[i])).join(" · ")}.`;if(t.type==="text")return `Eine passende Lösung ist: „${esc(t.answers[0])}“.`;return `Die richtige Reihenfolge lautet: ${t.answer.map(i=>esc(t.items[i])).join(" → ")}.`}
function advance(){if(state.index<categories[state.category].tasks.length-1){state.index++;renderQuestion()}else finish()}
function finish(){state.screen="result";state.total+=state.score;state.completed++;setLock(state.category,Date.now()+10*60*1000);const c=categories[state.category],s=state.score,total=c.tasks.length,ratio=s/total;let message=ratio>=0.9?"Hervorragend! Du hast das Thema richtig sicher im Griff.":ratio>=0.7?"Stark gemacht! Du kennst dich schon gut aus – ein paar Punkte kannst du noch festigen.":ratio>=0.4?"Guter Anfang! Mit etwas Wiederholung wirst du noch sicherer.":"Dranbleiben lohnt sich! Schau dir die Tipps an und probiere die anderen Themen aus.";let icon=ratio>=0.8?"🏆":ratio>=0.5?"🌟":"🌱";
 main.innerHTML=`<section class="game"><div class="game-head"><button class="back-btn" id="back-home">← Zur Übersicht</button><div class="game-meta"><span class="meta-chip">${c.icon} ${c.title}</span><span class="meta-chip">✅ Runde abgeschlossen</span></div></div><article class="question-card result-card"><div class="result-badge" aria-hidden="true">${icon}</div><p class="question-type">Deine Auswertung</p><h2>${c.title} geschafft!</h2><div class="result-score">${s}<span style="font-size:24px;color:#8490a4"> / ${total}</span></div><p class="result-copy">${message}</p><div class="mini-stats"><span>Richtige Antworten: ${s} von ${total}</span><span>Punkte insgesamt: ${state.total}</span></div><div class="result-actions"><button class="primary" id="result-home">Andere Kategorie spielen</button></div><p class="footer-note">Diese Kategorie ist jetzt 10 Minuten pausiert. Du kannst in der Übersicht sehen, wann sie wieder spielbar ist.</p></article></section>`;document.getElementById("back-home").addEventListener("click",home);document.getElementById("result-home").addEventListener("click",home)}
let toastTimer;function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2100)}
renderHome();
</script>
</body>
</html>
